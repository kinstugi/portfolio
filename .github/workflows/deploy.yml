name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (defaults to the latest main build, e.g. sha-abc1234). Leave blank for latest main."
        required: false
        type: string

# Don't fight in-flight deploys. Queue instead of cancelling so an
# in-progress push always finishes and the site never lands in a half-
# deployed state.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGION: ${{ vars.GCP_REGION }}
  PROJECT: ${{ vars.GCP_PROJECT_ID }}
  REPO: ${{ vars.GCP_ARTIFACT_REPO }}
  SERVICE: ${{ vars.GCP_SERVICE_NAME }}
  IMAGE_BASE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPO }}/site

jobs:
  deploy:
    name: Build & deploy to Cloud Run
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # id-token: write is required for Workload Identity Federation (OIDC).
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve image tag
        id: tag
        run: |
          if [ -n "${{ inputs.image_tag }}" ]; then
            echo "tag=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            short=$(echo "$GITHUB_SHA" | cut -c1-7)
            echo "tag=sha-${short}" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate to Google Cloud (OIDC)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${{ env.REGION }}-docker.pkg.dev" --quiet

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE_BASE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE_BASE }}:${{ steps.tag.outputs.tag }}
          # Idempotent: same flags as the manual bootstrap deploy.
          flags: |
            --allow-unauthenticated
            --memory=128Mi
            --cpu=1
            --min-instances=0
            --max-instances=1
            --concurrency=80

      - name: Print service URL
        if: steps.deploy.outputs.url != ''
        run: |
          echo "Deployed ${{ env.SERVICE }} to ${{ steps.deploy.outputs.url }}"
          echo "Image: ${{ env.IMAGE_BASE }}:${{ steps.tag.outputs.tag }}"
