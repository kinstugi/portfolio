worker_processes  auto;
worker_rlimit_nofile 8192;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 30;
    server_tokens   off;

    gzip              on;
    gzip_comp_level   6;
    gzip_min_length   256;
    gzip_proxied      any;
    gzip_vary         on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    server {
        # Port is templated at container start by entrypoint.sh (see __PORT__)
        listen       __PORT__ default_server;
        listen       [::]:__PORT__ default_server;
        server_name  _;

        root   /usr/share/nginx/html;
        index  index.html;

        # --- security headers ---
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options        "SAMEORIGIN" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy     "interest-cohort=()" always;

        # --- caching ---

        # HTML: never cached (so deploys show up immediately)
        location = / {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            try_files $uri $uri/ /index.html;
        }

        # data.js is served un-hashed and edited often (every project
        # added or stack tweaked) — keep it out of long caches so users
        # see deploys without a hard refresh. Everything else in this
        # block is treated as a hashed / versioned asset.
        location = /data.js {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            try_files $uri =404;
        }

        # Hashed / versioned assets: cache a year
        location ~* \.(?:css|js|woff2?|ttf|otf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable" always;
            try_files $uri =404;
        }

        # PDFs and other binary assets: cache a day
        location ~* \.(?:pdf|svg|png|jpg|jpeg|gif|webp|ico)$ {
            expires 1d;
            add_header Cache-Control "public" always;
            try_files $uri =404;
        }

        # Everything else: don't cache
        location / {
            add_header Cache-Control "no-cache" always;
            try_files $uri $uri/ /index.html;
        }

        # Hide hidden files
        location ~ /\. {
            deny all;
        }
    }
}
