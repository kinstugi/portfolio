<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0d0d1a" />
    <meta
      name="description"
      content="Portfolio of a senior software engineer (Python, FastAPI, Kafka, LLMs, C/C++). Based in Heilbronn, Germany."
    />
    <meta property="og:title" content="portfolio ~ whoami" />
    <meta
      property="og:description"
      content="Senior Software Engineer — Python, FastAPI, Kafka, LLMs. Hire me."
    />
    <meta property="og:type" content="website" />
    <title>portfolio ~ whoami</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/style.css" />
    <script>
      // Apply persisted theme before first paint to avoid a flash of wrong colors.
      (function () {
        try {
          var t = localStorage.getItem("portfolio:theme");
          if (t) document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <main id="terminal" class="terminal" aria-label="Interactive terminal portfolio">
      <header class="terminal__chrome" aria-hidden="true">
        <span class="dot dot--red"></span>
        <span class="dot dot--yellow"></span>
        <span class="dot dot--green"></span>
        <span class="terminal__title">user@portfolio: ~</span>
      </header>

      <section
        id="screen"
        class="terminal__screen"
        role="log"
        aria-live="polite"
        aria-label="Terminal output"
      ></section>

      <form id="form" class="terminal__form" autocomplete="off" spellcheck="false">
        <label class="terminal__prompt" for="input">
          <span class="prompt-user">user</span><span class="prompt-at">@</span><span
            class="prompt-host"
            >portfolio</span
          ><span class="prompt-colon">:</span><span class="prompt-path">~</span><span
            class="prompt-dollar"
            >$</span
          >
        </label>
        <input
          id="input"
          class="terminal__input"
          type="text"
          name="cmd"
          autocomplete="off"
          autocorrect="off"
          autocapitalize="off"
          spellcheck="false"
          aria-label="Terminal command input"
        />
      </form>

      <noscript>
        <p style="padding: 1rem">
          This portfolio is a small interactive terminal. Please enable JavaScript to view it.
        </p>
      </noscript>
    </main>

    <script type="module" src="/main.js"></script>
  </body>
</html>
